<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iPhone 17 价格对比 · 双十一</title>
<style>
  :root { --bg:#0f1115; --card:#171a21; --line:#2a2f3a; --txt:#e6e8ec; --muted:#8b93a3; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 -apple-system,"PingFang SC",system-ui,sans-serif; }
  .wrap { max-width:960px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .legend { display:flex; flex-wrap:wrap; gap:16px; margin-bottom:8px; }
  .legend span { display:inline-flex; align-items:center; gap:6px; color:var(--muted); }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  svg { width:100%; height:auto; display:block; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th,td { padding:8px 10px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  th { color:var(--muted); font-weight:500; }
  td.best { color:#4ade80; font-weight:600; }
  .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  button { background:#222834; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button:hover { border-color:#4b5563; }
  textarea { width:100%; min-height:200px; background:#0c0e13; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:12px; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .min { color:#4ade80; }
</style>
</head>
<body>
<div class="wrap">
  <h1>iPhone 17 价格对比 · 双十一</h1>
  <p class="sub">示例数据，按周记录各渠道到手价（元）。直接改下面文本框里的数据即可刷新。</p>

  <div class="card">
    <div class="legend" id="legend"></div>
    <svg id="chart" viewBox="0 0 900 360" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <div class="card">
    <table id="table"></table>
  </div>

  <div class="card">
    <div class="toolbar">
      <button id="apply">应用数据</button>
      <button id="reset">恢复示例</button>
    </div>
    <textarea id="editor" spellcheck="false"></textarea>
    <p class="hint">格式：[日期, 京东, 天猫, 拼多多, 官网]。日期用 YYYY-MM-DD。</p>
  </div>
</div>

<script>
const CHANNELS = [
  { key: "jd",     name: "京东",       color: "#e63946" },
  { key: "tmall",  name: "天猫",       color: "#f4a261" },
  { key: "pdd",    name: "拼多多",     color: "#2a9d8f" },
  { key: "apple",  name: "Apple 官网", color: "#6b7280" },
];

const SAMPLE = [
  ["2025-10-01", 5999, 5999, 5599, 5999],
  ["2025-10-08", 5999, 5999, 5499, 5999],
  ["2025-10-15", 5899, 5899, 5399, 5999],
  ["2025-10-22", 5899, 5849, 5299, 5999],
  ["2025-10-29", 5799, 5799, 5199, 5999],
  ["2025-11-01", 5699, 5699, 5099, 5999],
  ["2025-11-11", 5499, 5549, 4999, 5999],
  ["2025-11-15", 5749, 5699, 5149, 5999],
];

const editor = document.getElementById("editor");
const fmt = (rows) => rows.map(r => "[" + r.map((v, i) => i === 0 ? `"${v}"` : v).join(", ") + "]").join(",\n");

let data = [];

function load(rows) {
  data = rows.map(r => ({
    date: r[0],
    jd: +r[1], tmall: +r[2], pdd: +r[3], apple: +r[4],
  }));
  render();
}

function parse(text) {
  const src = "[" + text.replace(/\/\/[^\n]*/g, "").replace(/,\s*$/, "") + "]";
  const rows = Function("return " + src)();
  if (!Array.isArray(rows) || !rows.length) throw new Error("空数据");
  return rows;
}

function render() {
  renderLegend();
  renderChart();
  renderTable();
}

function renderLegend() {
  document.getElementById("legend").innerHTML = CHANNELS
    .map(c => `<span><i class="dot" style="background:${c.color}"></i>${c.name}</span>`)
    .join("");
}

function renderChart() {
  const svg = document.getElementById("chart");
  const W = 900, H = 360, pad = { t: 20, r: 20, b: 40, l: 64 };
  const iw = W - pad.l - pad.r, ih = H - pad.t - pad.b;
  const vals = data.flatMap(d => CHANNELS.map(c => d[c.key]));
  let min = Math.min(...vals), max = Math.max(...vals);
  const padV = Math.max(50, (max - min) * 0.2);
  min -= padV; max += padV;

  const x = i => pad.l + (data.length === 1 ? iw / 2 : (i / (data.length - 1)) * iw);
  const y = v => pad.t + ih - ((v - min) / (max - min)) * ih;

  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = min + (i / 4) * (max - min);
    const yy = y(v);
    g += `<line x1="${pad.l}" y1="${yy}" x2="${W - pad.r}" y2="${yy}" stroke="#2a2f3a"/>`;
    g += `<text x="${pad.l - 8}" y="${yy + 4}" fill="#8b93a3" font-size="11" text-anchor="end">${Math.round(v)}</text>`;
  }
  data.forEach((d, i) => {
    g += `<text x="${x(i)}" y="${H - 12}" fill="#8b93a3" font-size="11" text-anchor="middle">${d.date.slice(5)}</text>`;
  });

  for (const c of CHANNELS) {
    const pts = data.map((d, i) => `${x(i)},${y(d[c.key])}`).join(" ");
    g += `<polyline fill="none" stroke="${c.color}" stroke-width="2.5" points="${pts}"/>`;
    data.forEach((d, i) => { g += `<circle cx="${x(i)}" cy="${y(d[c.key])}" r="3.5" fill="${c.color}"/>`; });
  }
  // 双十一竖线
  const xi = data.findIndex(d => d.date.endsWith("11-11"));
  if (xi >= 0) g += `<line x1="${x(xi)}" y1="${pad.t}" x2="${x(xi)}" y2="${pad.t + ih}" stroke="#8b93a3" stroke-dasharray="4 4"/>`;
  svg.innerHTML = g;
}

function renderTable() {
  const best = data.map(d => Math.min(...CHANNELS.map(c => d[c.key])));
  let h = `<thead><tr><th>日期</th>${CHANNELS.map(c => `<th>${c.name}</th>`).join("")}</tr></thead><tbody>`;
  data.forEach((d, i) => {
    h += `<tr><td>${d.date}</td>` + CHANNELS.map(c =>
      `<td class="${d[c.key] === best[i] ? "best" : ""}">${d[c.key]}</td>`).join("") + `</tr>`;
  });
  h += "</tbody>";
  document.getElementById("table").innerHTML = h;
}

document.getElementById("apply").onclick = () => {
  try { load(parse(editor.value)); }
  catch (e) { alert("数据格式有误：" + e.message); }
};
document.getElementById("reset").onclick = () => {
  editor.value = fmt(SAMPLE);
  load(SAMPLE);
};

editor.value = fmt(SAMPLE);
load(SAMPLE);
</script>
</body>
</html>
